# Configuration file for Stock Price Prediction Project

# Data Configuration
data:
  symbol: "NVDA"                 # Default single-ticker run
  start_date: "2018-01-01"
  end_date: "2024-12-31"
  # Extended basket for the multi-ticker results table
  tickers: ["SPY", "AAPL", "MSFT", "NVDA", "JPM"]
  basket_start_date: "2015-01-01"
  # Committed CSV snapshots; the loader prefers these so runs reproduce offline
  snapshot_dir: "data/raw"
  allow_download: false          # Set true (or use --download) to refresh snapshots
  horizon: 1                     # Forecast horizon in trading days

# Feature Engineering
features:
  # Lagged features
  lag_periods: [1, 2, 3, 5, 10, 20]

  # Moving averages
  sma_windows: [10, 20, 50, 100, 200]
  ema_windows: [12, 26, 50]

  # Technical indicators
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_window: 20
  bollinger_std: 2
  atr_period: 14
  stoch_k: 14
  stoch_d: 3

  # Volume indicators
  volume_sma: 20
  obv: true

  # Volatility features
  rolling_std_windows: [10, 20, 30]

  # Price patterns
  price_changes: [1, 5, 10, 20]
  momentum_periods: [5, 10, 20]
  trend_windows: [10, 20, 50]

  # Restrict the model matrix to scale-free features (drop raw price/volume
  # levels such as sma_50 or obv, which do not transfer across a 10-year range)
  stationary_only: true

# Model Configuration
# Three families, fixed defaults. Nothing is tuned against a test fold; the exact
# values live in src/models.py DEFAULT_PARAMS and are documented in docs/PIPELINE.md.
models:
  families: ["linear", "forest", "boosting"]

# Backtesting
backtesting:
  initial_capital: 100000
  commission: 0.001    # 10 bps per side
  slippage: 0.0005     # 5 bps per side
  threshold: 0.0       # Minimum forecast log return required to hold the position
  cost_grid_bps: [0, 5, 10, 20]  # Per-side cost sensitivity sweep

# Evaluation
evaluation:
  confidence: 0.95     # Coverage for Wilson intervals on directional accuracy

# Paths
paths:
  models_dir: "models"
  results_dir: "results"

# Logging
logging:
  level: "INFO"

# Feature Selection
# Selection runs INSIDE the fitted pipeline, on the training window only.
feature_selection:
  enabled: true
  top_k: 40           # SelectKBest univariate F-score
  winsorize: true     # Clip features to training-window quantiles

# Training Options
# Walk-forward is the only validation path. Folds run forward in time with an
# embargo; nothing is ever shuffled.
training:
  initial_train: 504   # ~2 years of trading days in the first training window
  test_size: 63        # ~1 quarter per test fold
  step_size: 63        # Advance one quarter per fold
  expanding: true      # Expanding window; false gives a rolling window
  # Embargo between train end and test start. "auto" uses the feature warm-up
  # length (the deepest rolling lookback) plus the forecast horizon, so the raw
  # bars behind the training and test windows are strictly disjoint.
  embargo: "auto"

